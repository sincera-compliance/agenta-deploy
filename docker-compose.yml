name: agenta
services:
  web:
    image: ghcr.io/agenta-ai/${AGENTA_WEB_IMAGE_NAME:-agenta-web}:${AGENTA_WEB_IMAGE_TAG:-latest}
    command: sh -c "node ./oss/server.js"
    env_file:
    - .env
    environment:
    - AGENTA_SERVICES_INTERNAL_KEY=
    - HOSTNAME=0.0.0.0
    networks:
    - agenta-oss-gh-network
    restart: always
  api:
    image: ghcr.io/agenta-ai/${AGENTA_API_IMAGE_NAME:-agenta-api}:${AGENTA_API_IMAGE_TAG:-latest}
    command: 'gunicorn entrypoints.routers:app --bind 0.0.0.0:8000 --worker-class entrypoints.uvicorn_worker.DrainingUvicornWorker
      --workers 2 --worker-connections 1000 --backlog 2048 --keep-alive 620 --max-requests ${AGENTA_API_MAX_REQUESTS:-100000}
      --max-requests-jitter ${AGENTA_API_MAX_REQUESTS_JITTER:-10000} --timeout 60 --graceful-timeout ${AGENTA_API_GRACEFUL_TIMEOUT:-900}
      --log-level info --access-logfile - --error-logfile -

      '
    env_file:
    - .env
    environment:
    - AGENTA_SERVICES_INTERNAL_KEY=${AGENTA_SERVICES_INTERNAL_KEY:?AGENTA_SERVICES_INTERNAL_KEY is required}
    - SCRIPT_NAME=/api
    - DOCKER_NETWORK_MODE=${DOCKER_NETWORK_MODE:-bridge}
    - AGENTA_RUNNER_INTERNAL_URL=${AGENTA_RUNNER_INTERNAL_URL:-http://runner:8765}
    - AGENTA_RUNNER_TOKEN=${AGENTA_RUNNER_TOKEN:?AGENTA_RUNNER_TOKEN is required}
    - AGENTA_STORE_ENDPOINT_URL=${AGENTA_STORE_ENDPOINT_URL:-}
    - AGENTA_STORE_ACCESS_KEY=${AGENTA_STORE_ACCESS_KEY:-}
    - AGENTA_STORE_SECRET_KEY=${AGENTA_STORE_SECRET_KEY:-}
    - AGENTA_STORE_REGION=${AGENTA_STORE_REGION:-us-east-1}
    - AGENTA_STORE_BUCKET=${AGENTA_STORE_BUCKET:-}
    - AGENTA_STORE_SIGNING_KEY=${AGENTA_STORE_SIGNING_KEY:-}
    - AGENTA_MOUNTS_CREDENTIALS_TTL_SECONDS=${AGENTA_MOUNTS_CREDENTIALS_TTL_SECONDS:-}
    networks:
    - agenta-oss-gh-network
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      redis-volatile:
        condition: service_healthy
      redis-durable:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: always
  worker-streams:
    image: ghcr.io/agenta-ai/${AGENTA_API_IMAGE_NAME:-agenta-api}:${AGENTA_API_IMAGE_TAG:-latest}
    command:
    - python
    - -m
    - entrypoints.worker_streams
    env_file:
    - .env
    environment:
    - AGENTA_SERVICES_INTERNAL_KEY=
    - DOCKER_NETWORK_MODE=${DOCKER_NETWORK_MODE:-bridge}
    - AGENTA_WORKER_STREAMS=
    networks:
    - agenta-oss-gh-network
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      redis-volatile:
        condition: service_healthy
      redis-durable:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore'); sys.exit(0 if 'entrypoints.worker_streams'
        in cmd else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  worker-queues:
    image: ghcr.io/agenta-ai/${AGENTA_API_IMAGE_NAME:-agenta-api}:${AGENTA_API_IMAGE_TAG:-latest}
    command:
    - python
    - -m
    - entrypoints.worker_queues
    env_file:
    - .env
    environment:
    - AGENTA_SERVICES_INTERNAL_KEY=
    - DOCKER_NETWORK_MODE=${DOCKER_NETWORK_MODE:-bridge}
    - AGENTA_WORKER_QUEUES=
    networks:
    - agenta-oss-gh-network
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      redis-volatile:
        condition: service_healthy
      redis-durable:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore'); sys.exit(0 if 'entrypoints.worker_queues'
        in cmd else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  cron:
    image: ghcr.io/agenta-ai/${AGENTA_API_IMAGE_NAME:-agenta-api}:${AGENTA_API_IMAGE_TAG:-latest}
    init: true
    command: supercronic /app/crontab
    env_file:
    - .env
    environment:
    - AGENTA_SERVICES_INTERNAL_KEY=
    - DOCKER_NETWORK_MODE=${DOCKER_NETWORK_MODE:-bridge}
    networks:
    - agenta-oss-gh-network
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
    - postgres
    - api
    restart: always
  alembic:
    image: ghcr.io/agenta-ai/${AGENTA_API_IMAGE_NAME:-agenta-api}:${AGENTA_API_IMAGE_TAG:-latest}
    command: sh -c "python -m oss.databases.postgres.migrations.runner"
    env_file:
    - .env
    environment:
      AGENTA_SERVICES_INTERNAL_KEY: ''
    networks:
    - agenta-oss-gh-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  services:
    image: ghcr.io/agenta-ai/${AGENTA_SERVICES_IMAGE_NAME:-agenta-services}:${AGENTA_SERVICES_IMAGE_TAG:-latest}
    command: 'gunicorn entrypoints.main:app --bind 0.0.0.0:8080 --worker-class uvicorn.workers.UvicornWorker --workers 2 --worker-connections
      1000 --backlog 2048 --keep-alive 620 --max-requests 10000 --max-requests-jitter 1000 --timeout 60 --graceful-timeout
      60 --log-level info --access-logfile - --error-logfile -

      '
    env_file:
    - .env
    environment:
    - AGENTA_SERVICES_INTERNAL_KEY=${AGENTA_SERVICES_INTERNAL_KEY:?AGENTA_SERVICES_INTERNAL_KEY is required}
    - SCRIPT_NAME=/services
    - DOCKER_NETWORK_MODE=${DOCKER_NETWORK_MODE:-bridge}
    - AGENTA_RUNNER_INTERNAL_URL=${AGENTA_RUNNER_INTERNAL_URL:-http://runner:8765}
    - AGENTA_RUNNER_TOKEN=${AGENTA_RUNNER_TOKEN:?AGENTA_RUNNER_TOKEN is required}
    - AGENTA_STORE_ENDPOINT_URL=${AGENTA_STORE_ENDPOINT_URL:-}
    - AGENTA_STORE_ACCESS_KEY=${AGENTA_STORE_ACCESS_KEY:-}
    - AGENTA_STORE_SECRET_KEY=${AGENTA_STORE_SECRET_KEY:-}
    - AGENTA_STORE_REGION=${AGENTA_STORE_REGION:-us-east-1}
    - AGENTA_STORE_BUCKET=${AGENTA_STORE_BUCKET:-}
    - AGENTA_STORE_SIGNING_KEY=${AGENTA_STORE_SIGNING_KEY:-}
    networks:
    - agenta-oss-gh-network
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      runner:
        condition: service_healthy
    restart: always
  runner:
    image: ghcr.io/agenta-ai/${AGENTA_RUNNER_IMAGE_NAME:-agenta-runner}:${AGENTA_RUNNER_IMAGE_TAG:-latest}
    init: true
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      AGENTA_RUNNER_PORT: '8765'
      AGENTA_RUNNER_HOST: ${AGENTA_RUNNER_HOST:-0.0.0.0}
      AGENTA_RUNNER_REPLICA_ID: ${AGENTA_RUNNER_REPLICA_ID:-local-runner-1}
      AGENTA_API_URL: ${AGENTA_API_URL:-}
      AGENTA_API_INTERNAL_URL: ${AGENTA_API_INTERNAL_URL:-http://api:8000}
      AGENTA_API_KEY: ${AGENTA_API_KEY:-}
      AGENTA_RUNNER_TOKEN: ${AGENTA_RUNNER_TOKEN:?AGENTA_RUNNER_TOKEN is required}
      AGENTA_RUNNER_STATE_DIR: /var/lib/agenta/runner-state
      AGENTA_RUNNER_ENABLED_SANDBOX_PROVIDERS: ${AGENTA_RUNNER_ENABLED_SANDBOX_PROVIDERS:-local}
      AGENTA_RUNNER_DEFAULT_SANDBOX_PROVIDER: ${AGENTA_RUNNER_DEFAULT_SANDBOX_PROVIDER:-local}
      AGENTA_RUNNER_RUN_TOTAL_TIMEOUT_MS: ${AGENTA_RUNNER_RUN_TOTAL_TIMEOUT_MS:-}
      AGENTA_RUNNER_RUN_IDLE_TIMEOUT_MS: ${AGENTA_RUNNER_RUN_IDLE_TIMEOUT_MS:-}
      AGENTA_RUNNER_TOOL_CALL_TIMEOUT_MS: ${AGENTA_RUNNER_TOOL_CALL_TIMEOUT_MS:-}
      PI_CODING_AGENT_DIR: ${PI_CODING_AGENT_DIR:-/pi-agent}
      AGENTA_RUNNER_DAYTONA_API_KEY: ${AGENTA_RUNNER_DAYTONA_API_KEY:-}
      AGENTA_RUNNER_DAYTONA_API_URL: ${AGENTA_RUNNER_DAYTONA_API_URL:-}
      AGENTA_RUNNER_DAYTONA_TARGET: ${AGENTA_RUNNER_DAYTONA_TARGET:-}
      AGENTA_RUNNER_DAYTONA_SNAPSHOT: ${AGENTA_RUNNER_DAYTONA_SNAPSHOT:-}
      AGENTA_RUNNER_DAYTONA_IMAGE: ${AGENTA_RUNNER_DAYTONA_IMAGE:-}
      AGENTA_RUNNER_DAYTONA_AUTOSTOP_MINUTES: ${AGENTA_RUNNER_DAYTONA_AUTOSTOP_MINUTES:-}
      AGENTA_RUNNER_DAYTONA_SESSION_IDLE_TTL_MS: ${AGENTA_RUNNER_DAYTONA_SESSION_IDLE_TTL_MS:-}
      AGENTA_RUNNER_DAYTONA_SESSION_MAX_WARM: ${AGENTA_RUNNER_DAYTONA_SESSION_MAX_WARM:-}
      AGENTA_RUNNER_DAYTONA_AUTODELETE_MINUTES: ${AGENTA_RUNNER_DAYTONA_AUTODELETE_MINUTES:-}
      AGENTA_RUNNER_DAYTONA_OPAQUE_SECRETS: ${AGENTA_RUNNER_DAYTONA_OPAQUE_SECRETS:-}
      AGENTA_RUNNER_LIVE_FRAMES: ${AGENTA_RUNNER_LIVE_FRAMES:-true}
      AGENTA_GATEWAYS_INSECURE_HTTP_ALLOWED: ${AGENTA_GATEWAYS_INSECURE_HTTP_ALLOWED:-}
    volumes:
    - runner-state:/var/lib/agenta/runner-state
    networks:
    - agenta-oss-gh-network
    cap_add:
    - SYS_ADMIN
    devices:
    - /dev/fuse
    security_opt:
    - label=disable
    restart: always
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  postgres:
    image: postgres:17
    volumes:
    - postgres-data:/var/lib/postgresql/data/
    env_file:
    - .env
    environment:
      AGENTA_SERVICES_INTERNAL_KEY: ''
      POSTGRES_USER: ${POSTGRES_USER:-username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    networks:
    - agenta-oss-gh-network
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U username -d agenta_oss_core
      interval: 10s
      timeout: 5s
      retries: 5
    configs:
    - source: agenta_init_db
      target: /docker-entrypoint-initdb.d/init-db.sql
  redis-volatile:
    image: redis:8
    command: 'redis-server --appendonly no --save "" --maxmemory 512mb --maxmemory-policy volatile-lru --port 6379

      '
    volumes:
    - redis-volatile-data:/data
    networks:
    - agenta-oss-gh-network
    restart: always
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -p
      - '6379'
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  redis-durable:
    image: redis:8
    command: 'redis-server --appendonly yes --appendfsync no --aof-load-corrupt-tail-max-size 1048576 --save "" --maxmemory
      512mb --maxmemory-policy noeviction --port 6381

      '
    volumes:
    - redis-durable-data:/data
    networks:
    - agenta-oss-gh-network
    restart: always
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -p
      - '6381'
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    entrypoint:
    - sh
    - -c
    - 'cat > /etc/seaweedfs/s3.json <<EOF

      {"identities":[{"name":"agenta","credentials":[{"accessKey":"$${AGENTA_STORE_ACCESS_KEY}","secretKey":"$${AGENTA_STORE_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

      EOF

      cat > /etc/seaweedfs/iam.json <<EOF

      {"sts":{"tokenDuration":"1h","maxSessionLength":"12h","issuer":"seaweedfs-sts","signingKey":"$${AGENTA_STORE_SIGNING_KEY}"},"providers":[{"name":"agenta","type":"oidc","enabled":true,"config":{"issuer":"$${AGENTA_STORE_JWT_ISSUER}","clientId":"agenta-store","jwksUri":"$${AGENTA_STORE_JWT_ISSUER}/.well-known/jwks.json"}}],"policies":[{"name":"store-rw","document":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::$${AGENTA_STORE_BUCKET}","arn:aws:s3:::$${AGENTA_STORE_BUCKET}/*"]}]}}],"roles":[{"roleName":"agenta-store","roleArn":"arn:aws:iam::role/agenta-store","attachedPolicies":["store-rw"],"trustPolicy":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"agenta"},"Action":["sts:AssumeRoleWithWebIdentity"]}]}}]}

      EOF

      exec weed server -dir=/data -ip=seaweedfs -volume.max=64 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.iam.config=/etc/seaweedfs/iam.json

      '
    env_file:
    - .env
    environment:
      AGENTA_SERVICES_INTERNAL_KEY: ''
      AGENTA_STORE_ACCESS_KEY: ${AGENTA_STORE_ACCESS_KEY}
      AGENTA_STORE_SECRET_KEY: ${AGENTA_STORE_SECRET_KEY}
      AGENTA_STORE_BUCKET: ${AGENTA_STORE_BUCKET:-agenta-store}
      AGENTA_STORE_SIGNING_KEY: ${AGENTA_STORE_SIGNING_KEY}
      AGENTA_STORE_JWT_ISSUER: ${AGENTA_STORE_JWT_ISSUER:-http://api:8000}
    volumes:
    - seaweed-data:/data
    networks:
    - agenta-oss-gh-network
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:9333/cluster/healthz >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
  nginx:
    image: nginx:1
    env_file:
    - .env
    environment:
      AGENTA_SERVICES_INTERNAL_KEY: ''
    networks:
    - agenta-oss-gh-network
    depends_on:
    - api
    - web
    - services
    - web-mobile
    restart: always
    expose:
    - '80'
    configs:
    - source: agenta_nginx_conf
      target: /etc/nginx/nginx.conf
  supertokens:
    image: supertokens/supertokens-postgresql:11
    env_file:
    - .env
    environment:
      AGENTA_SERVICES_INTERNAL_KEY: ''
      POSTGRESQL_CONNECTION_URI: ${POSTGRES_URI_SUPERTOKENS}
    networks:
    - agenta-oss-gh-network
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection:
        close\r\n\r\n" >&3 && cat <&3 | grep "Hello"''

        '
      interval: 10s
      timeout: 5s
      retries: 5
  web-mobile:
    image: ghcr.io/agenta-ai/agenta-web-mobile:latest
    command: sh -c "node ./mobile/server.js"
    env_file:
    - .env
    environment:
    - AGENTA_SERVICES_INTERNAL_KEY=
    - AGENTA_API_INTERNAL_URL=http://api:8000
    - HOSTNAME=0.0.0.0
    networks:
    - agenta-oss-gh-network
    restart: unless-stopped
networks:
  agenta-oss-gh-network: null
volumes:
  runner-state: null
  postgres-data: null
  redis-volatile-data: null
  redis-durable-data: null
  seaweed-data: null
configs:
  agenta_nginx_conf:
    content: "events {\n    worker_connections 1024;\n}\n\nhttp {\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n\
      \n    resolver 127.0.0.11 valid=30s;\n\n    access_log /var/log/nginx/access.log;\n    error_log /var/log/nginx/error.log;\n\
      \n    gzip on;\n    gzip_vary on;\n    gzip_min_length 1024;\n    gzip_types text/plain text/css text/xml text/javascript\
      \ application/javascript application/xml+rss application/json;\n\n    limit_req_zone $$binary_remote_addr zone=api:10m\
      \ rate=10r/s;\n\n    server {\n        listen 80;\n        server_name _;\n\n        add_header X-Frame-Options DENY;\n\
      \        add_header X-Content-Type-Options nosniff;\n        add_header X-XSS-Protection \"1; mode=block\";\n\n    \
      \    client_max_body_size 32m;\n\n        location /api/ {\n            limit_req zone=api burst=20 nodelay;\n     \
      \       proxy_pass http://api:8000/;\n            proxy_http_version 1.1;\n            proxy_set_header Host $$host;\n\
      \            proxy_set_header X-Real-IP $$remote_addr;\n            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n\
      \            proxy_set_header X-Forwarded-Proto $$scheme;\n            proxy_set_header Upgrade $$http_upgrade;\n  \
      \          proxy_set_header Connection \"upgrade\";\n            proxy_buffering off;\n            proxy_connect_timeout\
      \ 60s;\n            proxy_send_timeout 3600s;\n            proxy_read_timeout 3600s;\n        }\n\n        location\
      \ /services/ {\n            proxy_pass http://services:8080/;\n            proxy_http_version 1.1;\n            proxy_set_header\
      \ Host $$host;\n            proxy_set_header X-Real-IP $$remote_addr;\n            proxy_set_header X-Forwarded-For\
      \ $$proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $$scheme;\n            proxy_set_header\
      \ Upgrade $$http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_buffering off;\n\
      \            proxy_connect_timeout 60s;\n            proxy_send_timeout 3600s;\n            proxy_read_timeout 3600s;\n\
      \        }\n\n        location = /m {\n            set $$mobile_upstream http://web-mobile:3000;\n            proxy_pass\
      \ $$mobile_upstream;\n            proxy_http_version 1.1;\n            proxy_set_header Host $$host;\n            proxy_set_header\
      \ X-Real-IP $$remote_addr;\n            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n            proxy_set_header\
      \ X-Forwarded-Proto $$scheme;\n            proxy_set_header Upgrade $$http_upgrade;\n            proxy_set_header Connection\
      \ \"upgrade\";\n        }\n\n        location /m/embed/ {\n            add_header X-Content-Type-Options nosniff;\n\
      \            set $$mobile_upstream http://web-mobile:3000;\n            proxy_pass $$mobile_upstream;\n            proxy_http_version\
      \ 1.1;\n            proxy_set_header Host $$host;\n            proxy_set_header X-Real-IP $$remote_addr;\n         \
      \   proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $$scheme;\n\
      \        }\n\n        location /m/ {\n            set $$mobile_upstream http://web-mobile:3000;\n            proxy_pass\
      \ $$mobile_upstream;\n            proxy_http_version 1.1;\n            proxy_set_header Host $$host;\n            proxy_set_header\
      \ X-Real-IP $$remote_addr;\n            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n            proxy_set_header\
      \ X-Forwarded-Proto $$scheme;\n            proxy_set_header Upgrade $$http_upgrade;\n            proxy_set_header Connection\
      \ \"upgrade\";\n        }\n\n        location /health {\n            proxy_pass http://api:8000/api/health;\n      \
      \      access_log off;\n        }\n\n        location / {\n            proxy_pass http://web:3000;\n            proxy_http_version\
      \ 1.1;\n            proxy_set_header Host $$host;\n            proxy_set_header X-Real-IP $$remote_addr;\n         \
      \   proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $$scheme;\n\
      \            proxy_set_header Upgrade $$http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n      \
      \  }\n    }\n}\n"
  agenta_init_db:
    content: '-- Ensure we are connected to the default postgres database before creating new databases

      \c postgres


      -- Create the ''username'' role with a password if it doesn''t exist

      SELECT ''CREATE ROLE username WITH LOGIN PASSWORD ''''password''''''

      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = ''username'')\gexec


      -- Create the ''agenta_oss_core'' database if it doesn''t exist

      SELECT ''CREATE DATABASE agenta_oss_core''

      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = ''agenta_oss_core'')\gexec


      -- Create the ''agenta_oss_tracing'' database if it doesn''t exist

      SELECT ''CREATE DATABASE agenta_oss_tracing''

      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = ''agenta_oss_tracing'')\gexec


      -- Create the ''agenta_oss_supertokens'' database if it doesn''t exist

      SELECT ''CREATE DATABASE agenta_oss_supertokens''

      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = ''agenta_oss_supertokens'')\gexec


      -- Grant necessary permissions to ''username'' for both databases

      GRANT ALL PRIVILEGES ON DATABASE agenta_oss_core TO username;

      GRANT ALL PRIVILEGES ON DATABASE agenta_oss_tracing TO username;

      GRANT ALL PRIVILEGES ON DATABASE agenta_oss_supertokens TO username;


      -- Switch to ''agenta_oss_core'' and grant schema permissions

      \c agenta_oss_core

      GRANT ALL ON SCHEMA public TO username;


      -- Switch to ''agenta_oss_tracing'' and grant schema permissions

      \c agenta_oss_tracing

      GRANT ALL ON SCHEMA public TO username;


      -- Switch to ''agenta_oss_supertokens'' and grant schema permissions

      \c agenta_oss_supertokens

      GRANT ALL ON SCHEMA public TO username;


      -- Return to postgres

      \c postgres

      '
